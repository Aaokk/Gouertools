# macOS（Apple Silicon + Intel）DMG；Windows（x64 + x86 NSIS）。每条 matrix job 上传 Artifact；推送 tag 「v…」且全部通过后自动发布 GitHub Release 并挂载安装包。
# Usage: Actions → Run workflow（仅 Artifact，不发 Release）；或 git push origin v… 完成后在 Releases 页查看同名 tag 的 Assets。
#
# 工件名称（Artifacts 下载 zip 名）；改 matrix.artifact 即可换前缀：
#   - Gouer-mac-arm64 / Gouer-mac-intel ：.dmg
#   - Gouer-win-x64 / Gouer-win-x86 ：.exe（均为 80x86 PC）
#
name: Tauri multi-platform builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: tauri-multi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            artifact: Gouer-mac-arm64
          - os: macos-latest
            rust-target: x86_64-apple-darwin
            artifact: Gouer-mac-intel
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            artifact: Gouer-win-x64
          - os: windows-latest
            rust-target: i686-pc-windows-msvc
            artifact: Gouer-win-x86

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Rust stable + ${{ matrix.rust-target }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Frontend deps
        run: npm ci

      - name: Ensure Rust target / std (${{ matrix.rust-target }})
        run: node scripts/ensure-rust-target.mjs ${{ matrix.rust-target }}

      - name: Sync version & bundle (vite + Cargo + copy to release/tauri/)
        run: npm run sync-version && node scripts/tauri-build.mjs --target ${{ matrix.rust-target }}

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/tauri/
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release (${{ github.ref_name }})
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 每个 matrix 工件在 dist/<artifact-name>/…，避免解压重名冲突
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Attach DMG / EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            - **Apple Silicon**：名称中含 **aarch64** / **arm64** 的 **DMG**
            - **Intel Mac**：对应的 **Intel / x86_64** **DMG**
            - **Windows**：**x64 / x86** 对应的安装 **exe**

            **macOS「已损坏，无法打开」**：多为隔离属性（quarantine）。先挂载 DMG，把 `.app` 拖到「应用程序」后，
            在终端执行（路径按实际修改；**`com.apple.quarantine` 与后面的路径之间必须有空格**）：
            `sudo xattr -r -d com.apple.quarantine "/Applications/Gouer工具包包.app"`

            若 `.app` 在你用户目录且你有写权限，也可不加 `sudo`。路径含空格时请用英文双引号包住整条路径。
          files: |
            dist/**/*.dmg
            dist/**/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

